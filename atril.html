<title>Atril</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d1730">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Familjen+Grotesk:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
/* Layout: a lectern — shelf of covers with a "keep reading" spread up top; the reader is one full-bleed page with tap zones and sheets that slide up from the bottom. */
:root{
  --bg:#efedf3; --surface:#fbfaf7; --ink:#231d35; --muted:#6c6680; --line:#dcd8e4;
  --plum:#4a3a7a; --brass:#c08a2e; --brass-soft:#f3e3c2; --shade:rgba(35,29,53,.14);
  --stage:#d9d5e1;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"Familjen Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17131f; --surface:#221c2f; --ink:#ece8f4; --muted:#a39cb8; --line:#352d47;
  --plum:#b6a3f0; --brass:#e1ab4c; --brass-soft:#3a2f1c; --shade:rgba(0,0,0,.45); --stage:#0f0c15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17131f; --surface:#221c2f; --ink:#ece8f4; --muted:#a39cb8; --line:#352d47;
  --plum:#b6a3f0; --brass:#e1ab4c; --brass-soft:#3a2f1c; --shade:rgba(0,0,0,.45); --stage:#0f0c15; color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,label:focus-within{outline:2px solid var(--brass);outline-offset:2px;border-radius:8px}
svg{display:block}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Library ---------- */
#library{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lib{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px;display:flex;flex-direction:column;gap:26px}
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1}
.brand i{font-weight:400;color:var(--brass)}
.stat{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:right;font-variant-numeric:tabular-nums}

.continue{position:relative;display:grid;grid-template-columns:104px 1fr;gap:18px;align-items:center;padding:18px;border-radius:20px;background:var(--plum);color:#f6f2ff;text-align:left;overflow:hidden;width:100%}
:root[data-theme="dark"] .continue{color:#1a1426}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .continue{color:#1a1426}}
.continue::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:var(--brass);opacity:.22}
.continue .cover{box-shadow:0 10px 24px rgba(0,0,0,.35)}
.continue .meta{min-width:0;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.continue h2{font-family:var(--f-display);font-size:21px;line-height:1.2;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);border-radius:9px}
.continue .sub{font-size:13px;opacity:.85;font-variant-numeric:tabular-nums}
.cta{margin-top:4px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px}

.section-h{display:flex;align-items:baseline;justify-content:space-between}
.section-h h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px}
.section-h span{font-size:13px;color:var(--muted)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:22px 16px}
.book{display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0;position:relative}
.cover{aspect-ratio:2/3;width:100%;max-width:100%;border-radius:4px 10px 10px 4px;background:var(--surface) center/cover no-repeat;box-shadow:0 6px 14px var(--shade), inset 4px 0 0 rgba(0,0,0,.12);position:relative;overflow:hidden}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 9%,rgba(255,255,255,.12) 11%,transparent 16%)}
.cover.blank{display:grid;place-items:center;font-family:var(--f-display);font-size:28px;color:var(--plum);background:var(--brass-soft)}
.book .t{font-size:13px;font-weight:500;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.book .p{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.book .p b{color:var(--brass);font-weight:600}
.tag{position:absolute;top:6px;left:8px;z-index:2;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--brass);color:#231d35;font-weight:600}
.book .del{position:absolute;top:4px;right:4px;z-index:2;width:28px;height:28px;border-radius:50%;background:rgba(20,15,30,.55);color:#fff;display:grid;place-items:center}
.book .del .ico{width:15px;height:15px}
.empty{padding:28px 18px;border:1.5px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--muted);line-height:1.5}

.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;align-items:center;gap:8px;padding:15px 20px 15px 16px;border-radius:999px;background:var(--brass);color:#231d35;font-weight:600;box-shadow:0 10px 26px rgba(192,138,46,.4);cursor:pointer;z-index:5}
.vh{position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0}
.drop{position:fixed;inset:0;z-index:50;background:rgba(74,58,122,.82);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:24px}

/* ---------- Reader ---------- */
#reader{position:fixed;inset:0;background:var(--stage);display:flex;flex-direction:column;z-index:10}
#reader[data-paper="sepia"]{--stage:#e9dcc4}
#reader[data-paper="night"]{--stage:#0c0a10}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;perspective:1600px;touch-action:pan-y pinch-zoom}
.stage.zoomed{overflow:auto;touch-action:auto}
.pagewrap{position:absolute;inset:0;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));will-change:transform;transform-origin:left center}
.stage.zoomed .pagewrap{position:relative;inset:auto;display:block;width:max-content;padding:16px}
.pagewrap canvas{display:block;max-width:100%;max-height:100%;border-radius:3px;box-shadow:0 14px 34px var(--shade),0 2px 6px var(--shade);background:#fff}
.stage.zoomed .pagewrap canvas{max-width:none;max-height:none}
#reader[data-paper="sepia"] canvas{filter:sepia(.42) saturate(1.1) brightness(.98)}
#reader[data-paper="night"] canvas{filter:invert(.9) hue-rotate(180deg) brightness(.95) contrast(.92);box-shadow:none}
.dim{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0;z-index:3}

.chrome{position:absolute;left:0;right:0;z-index:6;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
.top{top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.top .title{flex:1;min-width:0;font-family:var(--f-display);font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.iconbtn:active{background:var(--line)}
.iconbtn.on{color:var(--brass)}
.iconbtn.on .ico{fill:var(--brass)}
.bottom{bottom:0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.hidechrome .top{transform:translateY(-100%);opacity:0}
.hidechrome .bottom{transform:translateY(100%);opacity:0}
.pager{display:flex;align-items:center;gap:12px}
.pager .count{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:64px;text-align:right}
input[type=range]{flex:1;min-width:0;accent-color:var(--brass);height:28px}
.ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.pip{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);z-index:4;font-size:11.5px;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none;transition:opacity .2s}
#reader .pip{opacity:0}
#reader.hidechrome .pip{opacity:1}
.flash{position:absolute;top:50%;z-index:4;width:44px;height:44px;margin-top:-22px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 80%,transparent);opacity:0;pointer-events:none;transition:opacity .25s}
.flash.l{left:max(14px,env(safe-area-inset-left,0px))}.flash.r{right:max(14px,env(safe-area-inset-right,0px))}
.flash.show{opacity:.9}
.ribbon{position:absolute;top:0;right:max(26px,calc(env(safe-area-inset-right,0px) + 26px));z-index:2;width:18px;height:46px;background:var(--brass);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);transform:translateY(-100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.ribbon.on{transform:none}

.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:2;color:var(--muted);font-size:13px}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brass);animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,10,25,.45);z-index:20;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:78%;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:8px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px;flex:none}
.sheet h4{margin:0 0 12px;font-family:var(--f-display);font-size:19px;font-weight:600}
.tabs{display:flex;gap:6px;padding:4px;border-radius:12px;background:var(--bg);margin-bottom:12px;flex:none}
.tabs button{flex:1;padding:9px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px var(--shade)}
.list{overflow-y:auto;min-height:0;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row .lbl{flex:1;min-width:0;font-family:var(--f-display);font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.row .pg{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.row.cur .lbl{color:var(--brass)}
.row.l1 .lbl{padding-left:14px;font-size:14px}.row.l2 .lbl{padding-left:28px;font-size:13.5px}
.note{color:var(--muted);font-size:14px;line-height:1.5;padding:12px 2px}

.opt-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 10px}
.papers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.paper{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border-radius:14px;border:2px solid var(--line);font-size:13px;font-weight:500}
.paper[aria-pressed="true"]{border-color:var(--brass)}
.paper .sw{width:44px;height:56px;border-radius:4px;display:grid;place-items:center;font-family:var(--f-display);font-size:20px;box-shadow:0 3px 8px var(--shade)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:20px}
.seg button{padding:12px;border-radius:12px;border:2px solid var(--line);font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{border-color:var(--brass);color:var(--ink)}
.slider-row{display:flex;align-items:center;gap:12px;color:var(--muted)}
.slider-row .ico{width:18px;height:18px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);transform:translate(-50%,20px);z-index:40;padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 40px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Audiobook player ---------- */
.player{flex:none;position:relative;z-index:7;background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -12px 30px var(--shade);padding:14px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
#reader.audio .bottom,#reader.audio .pip{display:none}
.cap{display:flex;flex-direction:column;gap:6px;min-width:0}
.cap-top{display:flex;align-items:center;gap:8px}
.cap-meta{flex:1;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.cap-close{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.cap-close .ico{width:18px;height:18px}
.cap p{margin:0;font-family:var(--f-display);font-size:17px;line-height:1.45;min-height:2.9em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cap p mark{background:linear-gradient(transparent 58%,var(--brass-soft) 58%);color:inherit;padding:0 1px}
.cap .prog{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.cap .prog i{display:block;height:100%;width:0;background:var(--brass);transition:width .3s}
.pctl{display:grid;grid-template-columns:1fr auto auto auto 1fr;align-items:center;gap:10px}
.chip{justify-self:start;min-width:58px;padding:8px 12px;border-radius:99px;border:1.5px solid var(--line);font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.chip.r{justify-self:end}
.chip .ico{width:15px;height:15px}
.chip{white-space:nowrap}
#reader.audio ~ .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 230px)}
.chip.on{border-color:var(--brass);color:var(--brass)}
.skip{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.skip:active{background:var(--line)}
.skip .ico{width:26px;height:26px}
.play{width:66px;height:66px;border-radius:50%;background:var(--plum);color:var(--surface);display:grid;place-items:center;box-shadow:0 8px 20px var(--shade);position:relative}
.play .ico{width:28px;height:28px;fill:currentColor;stroke:none}
.play .eq{position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--brass);opacity:0}
.playing .play .eq{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.8}100%{transform:scale(1.18);opacity:0}}
.voice-sel{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:20px}
.iconbtn.audio-on{color:var(--brass)}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@media (min-width:640px){.continue{grid-template-columns:130px 1fr;padding:24px}.shelf{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
  <symbol id="i-mark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></symbol>
  <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 19l5-14 5 14M6 14h6M15 19l3.5-9 3.5 9M16.2 16h4.6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></symbol>
  <symbol id="i-ear" viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0116 0v2"/><rect x="3" y="14" width="4.5" height="7" rx="1.6"/><rect x="16.5" y="14" width="4.5" height="7" rx="1.6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 001.5.86l10.4-6.5a1 1 0 000-1.72L9.5 4.64A1 1 0 008 5.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.3"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.3"/></symbol>
  <symbol id="i-rew" viewBox="0 0 24 24"><path d="M11 7L6 12l5 5M18 7l-5 5 5 5"/></symbol>
  <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M13 7l5 5-5 5M6 7l5 5-5 5"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></symbol>
  <symbol id="i-zoom" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M11 8v6M8 11h6"/></symbol>
</svg>

<!-- LIBRARY -->
<main id="library">
  <div class="lib">
    <header class="masthead">
      <div class="brand">Atril<i>.</i></div>
      <div class="stat" id="stat">—</div>
    </header>
    <div id="continueSlot"></div>
    <section>
      <div class="section-h"><h3>Tu estante</h3><span id="shelfCount"></span></div>
      <div style="height:14px"></div>
      <div class="shelf" id="shelf"></div>
    </section>
  </div>
  <button class="fab" id="btnAdd" type="button"><svg class="ico"><use href="#i-plus"/></svg>Añadir PDF</button>
  <input type="file" id="fileIn" class="vh" accept="application/pdf,.pdf" multiple>
</main>

<!-- READER -->
<section id="reader" hidden data-paper="paper">
  <div class="stage" id="stage">
    <div class="ribbon" id="ribbon"></div>
    <div class="pagewrap" id="pagewrap"></div>
    <div class="loading" id="loading" hidden><div><div class="spinner"></div>Abriendo libro…</div></div>
    <div class="flash l" id="flashL"><svg class="ico"><use href="#i-back"/></svg></div>
    <div class="flash r" id="flashR"><svg class="ico"><use href="#i-next"/></svg></div>
    <div class="dim" id="dim"></div>
    <div class="pip" id="pip"></div>
  </div>
  <div class="chrome top">
    <button class="iconbtn" id="btnBack" aria-label="Volver a la biblioteca"><svg class="ico"><use href="#i-back"/></svg></button>
    <div class="title" id="rTitle"></div>

const $ = s => document.querySelector(s);
const pdfjs = window.pdfjsLib;
if (pdfjs) pdfjs.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* ---------- storage (IndexedDB, falls back to memory) ---------- */
const mem = new Map(); let db = null;
function openDB(){ return new Promise(res=>{ try{ const r=indexedDB.open("atril",1); r.onupgradeneeded=()=>r.result.createObjectStore("books",{keyPath:"id"}); r.onsuccess=()=>{db=r.result;res()}; r.onerror=()=>res(); }catch(e){res()} }); }
function tx(mode){ return db.transaction("books",mode).objectStore("books"); }
function put(b){ mem.set(b.id,b); if(!db) return Promise.resolve(); return new Promise(r=>{ try{ const q=tx("readwrite").put(b); q.onsuccess=q.onerror=()=>r(); }catch(e){r()} }); }
function del(id){ mem.delete(id); if(!db) return Promise.resolve(); return new Promise(r=>{ try{ const q=tx("readwrite").delete(id); q.onsuccess=q.onerror=()=>r(); }catch(e){r()} }); }
function all(){ if(!db) return Promise.resolve([...mem.values()]); return new Promise(r=>{ try{ const q=tx("readonly").getAll(); q.onsuccess=()=>{ q.result.forEach(b=>mem.set(b.id,b)); r(q.result) }; q.onerror=()=>r([...mem.values()]); }catch(e){r([...mem.values()])} }); }
const prefs = (()=>{ let p={paper:"paper",turn:"curl",bright:100,rate:1,voice:""}; try{ Object.assign(p,JSON.parse(localStorage.getItem("atril-prefs")||"{}")) }catch(e){} return p; })();
function savePrefs(){ try{ localStorage.setItem("atril-prefs",JSON.stringify(prefs)) }catch(e){} }

/* ---------- helpers ---------- */
const b64ToBuf = b64 => { const s=atob(b64), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u.buffer; };
const cleanName = n => n.replace(/\.pdf$/i,"").replace(/[_-]+/g," ").replace(/\s+/g," ").trim();
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let toastT; function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2000); }
function pct(b){ return b.pages ? Math.round((b.page)/b.pages*100) : 0; }

async function makeBook(buf, name, isSample){
  const doc = await pdfjs.getDocument({data:new Uint8Array(buf.slice(0)), isEvalSupported:false}).promise;
  let title = cleanName(name);
  try{ const m=await doc.getMetadata(); if(m.info && m.info.Title && m.info.Title.trim().length>2) title=m.info.Title.trim(); }catch(e){}
  let cover="";
  try{ const p=await doc.getPage(1); const v=p.getViewport({scale:1}); const s=360/v.width; const vp=p.getViewport({scale:s});
    const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height; const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
    await p.render({canvasContext:ctx,viewport:vp}).promise; cover=c.toDataURL("image/jpeg",.78); }catch(e){}
  const b = { id: isSample? "sample" : "b"+Date.now()+Math.random().toString(36).slice(2,6), title, file:name, data:buf, cover, pages:doc.numPages, page:1, marks:[], added:Date.now(), last: isSample? Date.now()-1 : 0, sample:!!isSample };
  doc.destroy(); return b;
}

/* ---------- library ---------- */
async function renderLibrary(){
  const books = (await all()).sort((a,b)=>(b.last||b.added)-(a.last||a.added));
  const reading = books.filter(b=>b.last).sort((a,b)=>b.last-a.last)[0];
  const done = books.filter(b=>b.pages && b.page>=b.pages).length;
  $("#stat").innerHTML = `${books.length} ${books.length===1?"libro":"libros"}<br>${done} terminado${done===1?"":"s"}`;

async function renderPage(n){
  const key=n+"@"+R.zoom+"@"+stage.clientWidth+"x"+stage.clientHeight;
  if(R.cache.has(key)) return R.cache.get(key);
  const pr=(async()=>{
    const p=await R.doc.getPage(n); const v=p.getViewport({scale:1});
    const W=stage.clientWidth-24, H=stage.clientHeight-24;
    const fit=Math.min(W/v.width, H/v.height)*R.zoom;
    const dpr=Math.min(window.devicePixelRatio||1, 3);
    const vp=p.getViewport({scale:fit*dpr});
    const c=document.createElement("canvas"); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
    c.style.width=Math.floor(vp.width/dpr)+"px"; c.style.height=Math.floor(vp.height/dpr)+"px";
    const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
    await p.render({canvasContext:ctx,viewport:vp}).promise; return c;
  })();
  R.cache.set(key,pr);
  if(R.cache.size>8){ R.cache.delete(R.cache.keys().next().value); }
  return pr;
}
function anim(el, frames, ms){ return new Promise(r=>{ try{ const a=el.animate(frames,{duration:ms,easing:"cubic-bezier(.22,.8,.25,1)",fill:"forwards"}); a.onfinish=r; }catch(e){ r(); } }); }

async function show(n, dir){

  if(R.busy) return; R.busy=true;

  $("#loading").hidden=true;
  const fresh=canvas.cloneNode(false); fresh.getContext("2d").drawImage(canvas,0,0); fresh.style.cssText=canvas.style.cssText;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(dir && !reduce && R.zoom===1 && wrap.firstChild){
    const old=document.createElement("div"); old.className="pagewrap"; old.style.zIndex=1; old.appendChild(wrap.firstChild); stage.insertBefore(old,wrap);
    wrap.style.transform=""; wrap.replaceChildren(fresh);
    if(prefs.turn==="curl"){
      if(dir>0){ old.style.transformOrigin="left center"; old.style.zIndex=2;
        await anim(old,[{transform:"rotateY(0)",filter:"brightness(1)"},{transform:"rotateY(-100deg)",filter:"brightness(.6)"}],480); }
      else { wrap.style.transformOrigin="left center"; wrap.style.zIndex=2;
        await anim(wrap,[{transform:"rotateY(-100deg)",filter:"brightness(.6)"},{transform:"rotateY(0)",filter:"brightness(1)"}],480);
        wrap.getAnimations().forEach(a=>a.cancel()); wrap.style.zIndex=""; }
    } else {
      await Promise.all([anim(old,[{transform:"translateX(0)"},{transform:`translateX(${-dir*100}%)`}],340),

      wrap.getAnimations().forEach(a=>a.cancel());
    }
    old.remove();
  } else { wrap.style.transform=""; wrap.replaceChildren(fresh); }

  // pre-render neighbours
  if(n<R.doc.numPages) renderPage(n+1); if(n>1) renderPage(n-1);
}

/* gestures */
let tStart=null, lastTap=0;
stage.addEventListener("pointerdown",e=>{ if(e.pointerType==="mouse"&&e.button!==0) return; tStart={x:e.clientX,y:e.clientY,t:Date.now(),id:e.pointerId,moved:false}; });
stage.addEventListener("pointermove",e=>{
  if(!tStart||e.pointerId!==tStart.id||R.zoom>1||R.busy) return;
  const dx=e.clientX-tStart.x, dy=e.clientY-tStart.y;
  if(Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)){ tStart.moved=true; wrap.style.transition="none"; wrap.style.transform=`translateX(${dx*.6}px) rotate(${dx/60}deg)`; }
});
stage.addEventListener("pointerup",e=>{
  if(!tStart||e.pointerId!==tStart.id) return;
  const dx=e.clientX-tStart.x, dy=e.clientY-tStart.y, dt=Date.now()-tStart.t, moved=tStart.moved; tStart=null;
  if(R.zoom>1){ // double tap to leave zoom
    if(Math.abs(dx)<8&&Math.abs(dy)<8){ const now=Date.now(); if(now-lastTap<300){ setZoom(1); lastTap=0; } else { lastTap=now; setTimeout(()=>{ if(lastTap===now){ reader.classList.toggle("hidechrome"); lastTap=0; } },300); } }
    return; }
  if(moved){
    wrap.style.transition="transform .25s"; wrap.style.transform="";
    setTimeout(()=>wrap.style.transition="",260);
    if(Math.abs(dx)>60 || (Math.abs(dx)>25 && dt<250)) turn(dx<0?1:-1);
    return;
  }
  if(Math.abs(dx)>8||Math.abs(dy)>8) return;
  const now=Date.now();
  if(now-lastTap<300){ lastTap=0; setZoom(2); return; }
  lastTap=now; const x=e.clientX, w=stage.clientWidth;
  setTimeout(()=>{ if(lastTap!==now) return; lastTap=0;
    if(x<w*.28) turn(-1); else if(x>w*.72) turn(1); else reader.classList.toggle("hidechrome");
  },260);
});
stage.addEventListener("pointercancel",()=>{ tStart=null; wrap.style.transform=""; });
addEventListener("keydown",e=>{
  if(reader.hidden) return;
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); turn(1); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); turn(-1); }
  else if(e.key==="Escape"){ if(document.querySelector(".sheet.show")) closeSheets(); else closeBook(); }
});

async function getOutline(){

      out.push({title:it.title,page,lvl:Math.min(lvl,2)}); if(it.items&&it.items.length) await walk(it.items,lvl+1); } }
    await walk(ol,0);

/* ---------- audiobook (Web Speech) ---------- */
const synth = window.speechSynthesis || null;
const A = { on:false, playing:false, page:1, i:0, sents:new Map(), token:0, sleep:0, sleepEnd:0, sleepT:null, wake:null, voice:null, empty:0 };
const RATES=[0.8,1,1.2,1.4,1.7,2], SLEEPS=[0,10,20,30,60];
function cleanText(items){
  // build lines with their font size, so headings get a pause instead of running into the text
  const lines=[]; let cur={t:"",h:0};
  for(const it of items){ if(!("str" in it)) continue; cur.t+=it.str; const h=Math.abs(it.transform?it.transform[3]||it.transform[0]:0)||it.height||0; if(it.str.trim()) cur.h=Math.max(cur.h,h); if(it.hasEOL){ lines.push(cur); cur={t:"",h:0}; } }
  if(cur.t.trim()) lines.push(cur);
  const w={}; lines.forEach(l=>{ const k=Math.round(l.h); w[k]=(w[k]||0)+l.t.length; });
  const body=+Object.keys(w).sort((x,y)=>w[y]-w[x])[0]||0;
  const kept=lines.map(l=>({t:l.t.replace(/\s+/g," ").trim(),h:l.h})).filter(l=>l.t && !/^[-–—\s|·]*\d{1,4}[-–—\s|·]*$/.test(l.t));
  let out="";
  kept.forEach((l,i)=>{
    const odd = body && (l.h>body*1.15 || l.h<body*0.85) && l.t.length<90;
    let t=l.t;
    if(odd && !/[.!?…:;»"”]$/.test(t)) t+=".";
    if(out && /[A-Za-zÁÉÍÓÚÜÑáéíóúüñ][-‐­]$/.test(out) && /^[a-záéíóúüñ]/.test(t)) out=out.slice(0,-1)+t;
    else out+=(out?" ":"")+t;
  });
  return out.replace(/\s+/g," ").trim();
}
function splitSentences(t){
  const out=[]; const parts=t.match(/[^.!?…]+(?:[.!?…]+["»”’')\]]*|$)/g)||[];
  for(let s of parts){ s=s.trim(); if(!s) continue;
    while(s.length>230){ let cut=s.lastIndexOf(", ",210); if(cut<70) cut=s.lastIndexOf(" ",210); if(cut<30) cut=210; out.push(s.slice(0,cut+1).trim()); s=s.slice(cut+1).trim(); }
    out.push(s); }
  return out.filter(x=>/[\p{L}\d]/u.test(x));
}
async function getSents(n){
  if(A.sents.has(n)) return A.sents.get(n);
  let arr=[]; try{ const p=await R.doc.getPage(n); const tc=await p.getTextContent(); arr=splitSentences(cleanText(tc.items)); }catch(e){}
  A.sents.set(n,arr); return arr;
}
function pickVoice(){
  if(!synth) return null; const vs=synth.getVoices(); if(!vs.length) return null;
  return vs.find(v=>v.name===prefs.voice) || vs.find(v=>/^es[-_](PE|419|MX|US|CO|AR|CL)/i.test(v.lang)) || vs.find(v=>/^es/i.test(v.lang)) || vs.find(v=>v.default) || vs[0];
}
function fillVoices(){
  const sel=$("#voiceSel"); if(!synth){ sel.innerHTML="<option>Este navegador no tiene voces</option>"; sel.disabled=true; return; }
  const vs=synth.getVoices(); if(!vs.length) return;
  const es=vs.filter(v=>/^es/i.test(v.lang)), other=vs.filter(v=>!/^es/i.test(v.lang));
  A.voice=pickVoice();
  const opt=v=>`<option value="${esc(v.name)}" ${A.voice&&v.name===A.voice.name?"selected":""}>${esc(v.name)} · ${esc(v.lang)}</option>`;
  sel.innerHTML=(es.length?`<optgroup label="Español">${es.map(opt).join("")}</optgroup>`:"")+(other.length?`<optgroup label="Otros idiomas">${other.map(opt).join("")}</optgroup>`:"");
}
if(synth){ fillVoices(); try{ synth.addEventListener("voiceschanged",fillVoices); }catch(e){ synth.onvoiceschanged=fillVoices; } }
$("#voiceSel").addEventListener("change",e=>{ prefs.voice=e.target.value; savePrefs(); A.voice=pickVoice(); if(A.playing) restartSpeech(); toast("Voz cambiada"); });

async function reqWake(){ try{ if(navigator.wakeLock && !A.wake){ A.wake=await navigator.wakeLock.request("screen"); A.wake.addEventListener("release",()=>{A.wake=null}); } }catch(e){} }

    navigator.mediaSession.metadata=new MediaMetadata({title:R.book.title,artist:"Atril · audiolibro",artwork:R.book.cover?[{src:R.book.cover,sizes:"360x540",type:"image/jpeg"}]:[]});

function audioClose(){
  if(!A.on) return; audioPause(); A.on=false; clearSleep();
  $("#player").hidden=true; reader.classList.remove("audio","playing");
  $("#btnAudio").classList.remove("audio-on"); $("#btnAudio").setAttribute("aria-label","Escuchar como audiolibro");
  refit();
}
function refit(){ requestAnimationFrame(()=>{ if(R.doc){ R.cache.clear(); show(R.page,0); } }); }
$("#btnAudio").onclick=()=>A.on?audioClose():audioOpen();
$("#aClose").onclick=audioClose;

function audioPlay(){
  if(!A.on) audioOpen();
  if(!synth) return;
  try{ synth.resume(); }catch(e){}
  A.playing=true; reader.classList.add("playing"); reqWake(); paintPlayer(); speakCurrent();
}
function audioPause(){
  A.playing=false; A.token++; try{ synth && synth.cancel(); }catch(e){}
  reader.classList.remove("playing"); dropWake(); paintPlayer(); saveAudio();
}
$("#aPlay").onclick=()=>A.playing?audioPause():audioPlay();
function restartSpeech(){ A.token++; try{ synth.cancel(); }catch(e){} setTimeout(()=>{ if(A.playing) speakCurrent(); },80); }

async function speakCurrent(){
  const tok=++A.token;
  let s=await getSents(A.page); if(tok!==A.token) return;
  if(A.i<0){ A.i=Math.max(0,s.length+A.i); }
  while(A.i>=s.length){
    if(!s.length){ A.empty++; if(A.empty>=4){ audioPause(); paintPlayer("Estas páginas no tienen texto que leer. Si el PDF es escaneado (fotos de páginas), necesita OCR primero."); return; } }
    if(A.page>=R.doc.numPages){ audioPause(); A.i=0; paintPlayer("Fin del libro. ¡Lo terminaste!"); return; }
    if(A.sleep==="page"){ clearSleep(); audioPause(); paintPlayer(); toast("Temporizador: fin de página"); return; }
    A.page++; A.i=0; s=await getSents(A.page); if(tok!==A.token) return;
    followPage();
  }
  if(s.length) A.empty=0;
  paintPlayer();
  const u=new SpeechSynthesisUtterance(s[A.i]);
  if(A.voice){ u.voice=A.voice; u.lang=A.voice.lang; } else u.lang="es-ES";
  u.rate=prefs.rate; u.pitch=1;
  u.onboundary=ev=>{ if(tok!==A.token||ev.name&&ev.name!=="word") return; highlightWord(s[A.i],ev.charIndex,ev.charLength); };
  u.onend=()=>{ if(tok!==A.token||!A.playing) return; A.i++; saveAudio(); if(sleepDue()) return; speakCurrent(); };
  u.onerror=ev=>{ if(tok!==A.token||!A.playing) return; if(ev.error==="interrupted"||ev.error==="canceled") return; if(ev.error==="not-allowed"){ audioPause(); toast("Toca reproducir para empezar a escuchar"); return; } A.i++; speakCurrent(); };
  synth.speak(u);
}
function followPage(){
  if(R.page===A.page) return;
  if(R.busy){ setTimeout(followPage,300); return; }
  show(A.page, A.page>R.page?1:-1);
}
function onReaderPage(){
  if(R.page===A.page) { paintPlayer(); return; }
  A.page=R.page; A.i=0; A.empty=0;
  if(A.playing) restartSpeech(); else paintPlayer();
}
async function skipSentence(d){
  if(!A.on) return; A.token++; try{ synth.cancel(); }catch(e){}
  const s=await getSents(A.page);
  A.i+=d;
  if(A.i<0){ if(A.page>1){ A.page--; const p=await getSents(A.page); A.i=Math.max(0,p.length-1); followPage(); } else A.i=0; }
  else if(A.i>=s.length && A.page<R.doc.numPages){ A.page++; A.i=0; followPage(); }
  else if(A.i>=s.length){ A.i=Math.max(0,s.length-1); }
  saveAudio();
  if(A.playing) setTimeout(()=>{ if(A.playing) speakCurrent(); },80); else paintPlayer();
}
$("#aPrev").onclick=()=>skipSentence(-1);
$("#aNext").onclick=()=>skipSentence(1);

async function paintPlayer(msg){
  const play=$("#aPlay"); play.querySelector("use").setAttribute("href",A.playing?"#i-pause":"#i-play"); play.setAttribute("aria-label",A.playing?"Pausar":"Reproducir");
  $("#aRate").textContent=(prefs.rate+"").replace(".",",")+"×";
  const sl=$("#aSleep"); sl.classList.toggle("on",!!A.sleep); sl.querySelector("span").textContent= A.sleep==="page"?"Pág.": A.sleep? Math.max(1,Math.ceil((A.sleepEnd-Date.now())/60000))+" min" : "No";
  if(!R.doc) return;
  const s=await getSents(A.page);
  const N=R.doc.numPages;
  $("#capMeta").textContent = s.length ? `Página ${A.page} de ${N} · frase ${Math.min(A.i+1,s.length)} de ${s.length}` : `Página ${A.page} de ${N}`;
  $("#capProg").style.width = s.length ? ((A.page-1 + Math.min(A.i,s.length)/s.length)/N*100)+"%" : ((A.page-1)/N*100)+"%";
  $("#capText").textContent = msg || (s.length ? s[Math.min(A.i,s.length-1)] : "Esta página no tiene texto para leer. Avanza o toca reproducir para saltar a la siguiente.");
}
function highlightWord(text,start,len){
  if(start==null) return; if(!len){ const m=text.slice(start).match(/^[\p{L}\d'’-]+/u); len=m?m[0].length:0; }
  const el=$("#capText"); el.innerHTML=esc(text.slice(0,start))+"<mark>"+esc(text.slice(start,start+len))+"</mark>"+esc(text.slice(start+len));
}
let saveAT; function saveAudio(){ if(!R.book) return; R.book.audio={page:A.page,i:A.i}; clearTimeout(saveAT); saveAT=setTimeout(()=>put(R.book),500); }

$("#aRate").onclick=()=>{ const k=RATES.indexOf(prefs.rate); prefs.rate=RATES[(k+1)%RATES.length]; savePrefs(); paintPlayer(); if(A.playing) restartSpeech(); };
function clearSleep(){ A.sleep=0; A.sleepEnd=0; clearInterval(A.sleepT); }
function sleepDue(){ if(typeof A.sleep==="number" && A.sleep && Date.now()>=A.sleepEnd){ clearSleep(); audioPause(); toast("Temporizador terminado. Buenas noches."); return true; } return false; }
$("#aSleep").onclick=()=>{
  const order=[0,10,20,30,60,"page"]; const k=order.indexOf(A.sleep); const nx=order[(k+1)%order.length];
  clearSleep(); A.sleep=nx;
  if(typeof nx==="number" && nx){ A.sleepEnd=Date.now()+nx*60000; A.sleepT=setInterval(()=>paintPlayer(),30000); toast(`Se detendrá en ${nx} minutos`); }
  else if(nx==="page") toast("Se detendrá al terminar esta página"); else toast("Temporizador apagado");
  paintPlayer();
};

/* ---------- boot ---------- */
(async function boot(){
  if(!pdfjs){ $("#shelf").innerHTML='<div class="empty" style="grid-column:1/-1">No se pudo cargar el motor de PDF. Revisa tu conexión y recarga la página.</div>'; return; }
  await openDB();
  let books=await all();
  let seeded=false; try{ seeded=localStorage.getItem("atril-seeded")==="1" }catch(e){}
  if(!books.length && !seeded){
    try{ const b=await makeBook(b64ToBuf(SAMPLE_B64),"Fabulas de siempre.pdf",true); b.page=3; await put(b); }catch(e){}
    try{ localStorage.setItem("atril-seeded","1") }catch(e){}
  }
  renderLibrary();
})();
</script>
